spring:
  application:
    name: airport-emergency-rescue-system
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  datasource:
    url: jdbc:mysql://localhost:3306/airport_emergency?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8mb4
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
    password:
    timeout: 60000
    database: 0

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: airport_emergency_rescue_system_secret_key_2024
  expiration: 86400000
  refreshExpiration: 604800000

logging:
  level:
    root: INFO
    com.airport.emergency: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/application.log

app:
  name: 机场应急救援管理系统
  version: 1.0.0
